services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mechanics_software
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      # The default guest user only accepts connections from localhost, so the api container
      # needs a dedicated user.
      RABBITMQ_DEFAULT_USER: mechanics
      RABBITMQ_DEFAULT_PASS: mechanics
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mechanics_software;Username=postgres;Password=postgres
      - JWT_SECRET=dev-secret-change-in-production-min-32-chars!!
      - GATEWAY_KEY=${GATEWAY_KEY:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=mechanics
      - RABBITMQ_PASSWORD=mechanics
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
