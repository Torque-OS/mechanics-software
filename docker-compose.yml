services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mechanics_software
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      # Dedicated user instead of guest/guest, so local credentials match RABBITMQ_USERNAME and
      # RABBITMQ_PASSWORD in appsettings.Development.json and env.example.
      RABBITMQ_DEFAULT_USER: mechanics
      RABBITMQ_DEFAULT_PASS: mechanics
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mechanics_software;Username=postgres;Password=postgres
      - JWT_SECRET=dev-secret-change-in-production-min-32-chars!!
      - GATEWAY_KEY=${GATEWAY_KEY:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=mechanics
      - RABBITMQ_PASSWORD=mechanics
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-dev@example.com}
      - SMTP_PASS=${SMTP_PASS:-dev-password}
      - SMTP_FROM=${SMTP_FROM:-noreply@mechanics-software.local}
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=mechanics_software
      - MongoDB__CollectionName=service_order_status_history
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
