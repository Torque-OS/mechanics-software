apiVersion: v1
kind: Service
metadata:
  name: mechanics-software-api
  namespace: mechanics-software
  labels:
    app: mechanics-software-api
  annotations:
    # An NLB, because API Gateway private integrations cannot target the
    # Classic Load Balancer that EKS would otherwise create.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # No public address at all: the only way in is the API Gateway VPC Link.
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: mechanics-software-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
