apiVersion: v1
kind: Secret
metadata:
  name: mechanics-secrets
  namespace: mechanics-software
  labels:
    app: mechanics-software
type: Opaque
stringData:
  MongoDB__ConnectionString: "${MONGODB_CONNECTION_STRING}"
  MongoDB__DatabaseName: "os_service"
  MongoDB__CollectionName: "service_order_status_history"
  ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=5432;Database=mechanicssoftware;Username=mechanic_admin;Password=${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  GATEWAY_KEY: "${GATEWAY_KEY}"
  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"
  SMTP_USER: "${SMTP_USER}"
  SMTP_PASS: "${SMTP_PASS}"
  SMTP_FROM: "${SMTP_FROM}"
  RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
