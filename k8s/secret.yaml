apiVersion: v1
kind: Secret
metadata:
  name: mechanics-secrets
  namespace: mechanics-software
  labels:
    app: mechanics-software
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=5432;Database=mechanicssoftware;Username=mechanic_admin;Password=${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  GATEWAY_KEY: "${GATEWAY_KEY}"
  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"
  SMTP_USER: "${SMTP_USER}"
  SMTP_PASS: "${SMTP_PASS}"
  SMTP_FROM: "${SMTP_FROM}"
  