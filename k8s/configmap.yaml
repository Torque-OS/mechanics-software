apiVersion: v1
kind: ConfigMap
metadata:
  name: mechanics-config
  namespace: mechanics-software
  labels:
    app: mechanics-software
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080" # nosonar — TLS terminated at ingress; plain HTTP is correct for intra-cluster traffic
  DD_SERVICE: "mechanics-software-api"
  DD_ENV: "prod"
  DD_VERSION: "latest"
  DD_LOGS_ENABLED: "true"
  DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
  DD_APM_ENABLED: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_TRACE_SAMPLE_RATE: "1"
  OTEL_SERVICE_NAME: "mechanics-software-api"
  # RabbitMQ provisioned by mechanics-infra-k8s (F4-08): service "rabbitmq" in namespace "messaging",
  # one vhost shared by the OS, Billing and Execution services so the saga messages reach each other.
  RABBITMQ_HOST: "rabbitmq.messaging.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/torque-os"
