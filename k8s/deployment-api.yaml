apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanics-software-api
  namespace: mechanics-software
  labels:
    app: mechanics-software-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mechanics-software-api
  template:
    metadata:
      labels:
        app: mechanics-software-api
      annotations:
        ad.datadoghq.com/api.checks: >-
          {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:8080/metrics","namespace":"mechanics","metrics":["mechanics_service_orders_opened_total","mechanics_service_orders_completed_total","mechanics_service_orders_average_execution_time_hours","mechanics_service_orders_execution_time_order_count","mechanics_service_orders_by_status_total","mechanics_service_orders_execution_duration_hours_by_status.*","mechanics_service_orders_current_by_status.*","mechanics_service_orders_average_execution_duration_hours_by_status.*","mechanics_http_errors_total","mechanics_http_request_duration_ms.*"]}]}}
        ad.datadoghq.com/api.logs: >-
          [{"source":"dotnet","service":"mechanics-software-api"}]
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/torque-os/mechanics-software:latest # NOSONAR
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mechanics-config
            - secretRef:
                name: mechanics-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
